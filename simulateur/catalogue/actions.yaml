  pki.certificat.revoquer:
    niveau: N3
    type: modification
    cible: machine
    parametres: { numero_serie: texte }
    commandes: ["certutil -revoke"]
  pki.ca.renouveler:
    niveau: N3
    type: modification
    cible: machine
    commandes: ["certutil -renewCert"]
    interfaces: ["Autorité de certification > Renouveler le certificat de l'AC"]

