    commandes: ["Get-Package", "Get-ItemProperty HKLM:\\SOFTWARE\\...\\Uninstall\\*", "winget list"]
    interfaces: ["Paramètres > Applications installées", "Programmes et fonctionnalités"]
  machine.logiciel.installer:
    niveau: { poste: N2, serveur: N2, dc: N3 }
    type: modification
    cible: machine
    parametres: { produit: texte }
    commandes: ["msiexec /i", "Start-Process setup.exe"]
  machine.registre.lire:
    niveau: { poste: N2, serveur: N2, dc: N2 }
    type: lecture
    cible: machine
    parametres: { cle: texte }
    commandes: ["Get-ItemProperty HKLM:", "reg query"]
    interfaces: ["regedit"]
  machine.registre.modifier:
    niveau: { poste: N2, serveur: N2, dc: N3 }
    type: modification
    cible: machine
    parametres: { cle: texte, valeur: valeur }
    commandes: ["Set-ItemProperty HKLM:", "reg add"]
    interfaces: ["regedit"]
  machine.admin_local.ajouter:
    niveau: { poste: N1, serveur: N2, dc: N3 }
    type: modification
    cible: machine
    description: Ajouter un compte au groupe Administrateurs local.
    parametres: { compte: texte }
    commandes: ["Add-LocalGroupMember -Group Administrateurs", "net localgroup Administrateurs /add"]
    interfaces: ["Gestion de l'ordinateur > Groupes locaux"]
  machine.antivirus.desactiver:
    niveau: { poste: N2, serveur: N2, dc: N3 }
    type: modification
    cible: machine
    commandes: ["Set-MpPreference -DisableRealtimeMonitoring $true"]
