    cible: machine
    parametres: { session: texte }
    commandes: ["klist", "klist -li 0x3e7"]
  machine.kerberos.purger:
    niveau: { poste: N2, serveur: N2, dc: N3 }
    type: modification
    cible: machine
    parametres: { session: texte }
    commandes: ["klist purge", "klist -li 0x3e7 purge"]
  machine.logiciels.lire:
    niveau: { poste: N1, serveur: N2, dc: N2 }
    type: lecture
    cible: machine
