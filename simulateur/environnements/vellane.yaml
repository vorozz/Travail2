# Les membres des groupes d'utilisateurs sont déduits du champ `groupes` des
# comptes ; `membres` ne sert qu'aux groupes d'ordinateurs.

filtres_wmi:
  Windows 10 uniquement:
    requete: SELECT * FROM Win32_OperatingSystem WHERE Version LIKE "10.0.1%"

gpo:
  Default Domain Policy:
    guid: "{31B2F340-016D-11D2-945F-00C04FB984F9}"
    liens: [{ cible: "" }]
    filtrage: { appliquer: [Utilisateurs authentifiés] }
    parametres: ["Stratégies de comptes (mot de passe, verrouillage, Kerberos) : voir domaines.vellane.local"]
  Default Domain Controllers Policy:
    guid: "{6AC1786C-016F-11D2-945F-00C04FB984F9}"
    liens: [{ cible: OU=Domain Controllers }]
    filtrage: { appliquer: [Utilisateurs authentifiés] }
  GPO_U_Lecteurs_Reseau:
    guid: "{8D2E5F14-3C71-4B0A-9E62-71A4C0B95D13}"
    liens: [{ cible: 'OU=Utilisateurs,OU=Paris' }, { cible: 'OU=Utilisateurs,OU=Lyon' }, { cible: 'OU=Utilisateurs,OU=Nantes' }]
    filtrage: { appliquer: [Utilisateurs authentifiés] }
    lecteurs:
      H: { chemin: '\\SRV-FIC-01\Perso$\%USERNAME%' }
      S: { chemin: '\\SRV-FIC-01\Services' }
      P: { chemin: '\\SRV-FIC-01\Projets_CG', ciblage_groupes: [GG_CTRLGEST_Projets_RW, GG_CTRLGEST_Projets_R] }
      W: { chemin: '\\SRV-FIC-01\Archives_CG', ciblage_groupes: [GG_CTRLGEST_Archives_RW] }
      B: { chemin: '\\SRV-FIC-01\Budget_Direction', ciblage_groupes: [GG_CTRLGEST_Budget_Direction] }
      R: { chemin: '\\SRV-FIC-01\RH', ciblage_groupes: [GG_RH_Tous] }
      Q: { chemin: '\\SRV-FIC-02\Projets', ciblage_groupes: [GG_Projets_Paris] }
      K: { chemin: '\\SRV-FIC-01\Qualite', ciblage_groupes: [GG_Qualite_Nantes] }
  GPO_C_Postes_Securite:
    guid: "{0B7A92C3-55E1-4D8F-A1B6-2E9C47D083F5}"
    liens: [{ cible: 'OU=Postes,OU=Paris' }, { cible: 'OU=Postes,OU=Lyon' }, { cible: 'OU=Postes,OU=Nantes' }]
    filtrage: { appliquer: [Utilisateurs authentifiés] }
    parametres: ["Verrouillage de l'écran après 10 min", "BitLocker : sauvegarde de la clé de récupération dans AD", "Windows LAPS : sauvegarde dans AD, rotation 30 jours"]
  GPO_C_Paris_Imprimantes:
    guid: "{4E1F0C88-91A2-4F3B-B7D5-6A0E2C9F1B47}"
    liens: [{ cible: 'OU=Postes,OU=Paris' }]
