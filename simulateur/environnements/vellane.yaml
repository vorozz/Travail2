# --- Réseau -----------------------------------------------------------------

dns:
  serveurs: [DC-PAR-01, DC-PAR-02, DC-LYO-01, DC-NTE-01]
  redirecteurs: [192.0.2.53, 198.51.100.53]
  redirecteurs_conditionnels:
    orbis.local: { serveurs: [172.16.0.10, 172.16.0.13], etendue_replication: foret }
  zones:
    vellane.local:
      type: integree_ad
      etendue_replication: domaine
      mises_a_jour: securisees
      vieillissement: { actif: true, non_actualisation: 7j, actualisation: 7j }
      nettoyage: { serveur: DC-PAR-01, periode: 7j, dernier: -3j }
      # Enregistrements A des contrôleurs, serveurs et postes : générés par le
      # moteur à partir de leur adresse (inscription dynamique, horodatée).
      enregistrements_generes: [controleurs, serveurs, postes]
      enregistrements:
        intranet: [{ type: CNAME, donnees: SRV-WEB-01.vellane.local, statique: true }]
        notesdefrais: [{ type: CNAME, donnees: SRV-WEB-01.vellane.local, statique: true }]
        api: [{ type: CNAME, donnees: SRV-WEB-01.vellane.local, statique: true }]
        compta: [{ type: CNAME, donnees: SRV-APP-01.vellane.local, statique: true }]
        pki: [{ type: CNAME, donnees: SRV-PKI-01.vellane.local, statique: true }]
        deploiement: [{ type: CNAME, donnees: SRV-DEPLOI-01.vellane.local, statique: true }]
    _msdcs.vellane.local:
      type: integree_ad
      etendue_replication: foret
      mises_a_jour: securisees
      # CNAME <guid_dsa>, SRV _ldap, _kerberos, _gc, pdc : générés à partir des DC.
