    controleurs: [DC-NTE-01]

replication:
  partitions:
    - DC=vellane,DC=local
    - CN=Configuration,DC=vellane,DC=local
    - CN=Schema,CN=Configuration,DC=vellane,DC=local
    - DC=DomainDnsZones,DC=vellane,DC=local
    - DC=ForestDnsZones,DC=vellane,DC=local
  liens_de_sites:
    PAR-LYO: { sites: [Paris-Siege, Lyon], cout: 100, intervalle: 180m }
    PAR-NTE: { sites: [Paris-Siege, Nantes], cout: 100, intervalle: 180m }
  # Connexions entrantes : destination -> source -> état. Un état vide
  # reprend `etat_par_defaut`.
  connexions:
    DC-PAR-01: { DC-PAR-02: {}, DC-LYO-01: {}, DC-NTE-01: {} }
    DC-PAR-02: { DC-PAR-01: {} }
    DC-LYO-01: { DC-PAR-01: {} }
    DC-NTE-01: { DC-PAR-01: {} }
  etat_par_defaut:
    derniere_tentative: -6m
    derniere_reussite: -6m
    erreur: 0
    echecs_consecutifs: 0

