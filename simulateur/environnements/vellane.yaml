# Environnement de référence commun à tous les scénarios : l'entreprise
# fictive Vellane, dans son état NORMAL. Chaque scénario y superpose son
# incident (section `monde`, fusion décrite dans FORMAT.md).
#
# Conventions :
# - Les DN sont écrits sans le suffixe du domaine (DC=vellane,DC=local est
#   ajouté par le moteur selon le domaine de l'objet).
# - Les dates relatives (-41j, +3h) sont comptées depuis l'horloge du
#   scénario ; les dates absolues (2031-03-15) sont fixes.
# - Les services Windows standard sont démarrés sauf mention contraire.

schema: environnement/1
id: vellane
nom: Vellane
description: >
  Distributeur fictif de fournitures techniques, 2 400 salariés. Siège à
  Paris, agences à Lyon et Nantes. Filiale Orbis rachetée en 2025 : forêt
  séparée, approbation de forêt bidirectionnelle.
fuseau: Europe/Paris

apprenant:
  compte: tech.apprenant
  compte_admin: adm-apprenant
  poste: PC-PAR-0020

equipes:
  N1-Support: { libelle: Centre de services (support de proximité), niveau: N1 }
  N2-Systemes:
    libelle: Support systèmes
    niveau: N2
    traite: [comptes, postes, gpo, dns, dhcp, canal_securise, horloge, partages, impression]
  N3-Infrastructure:
    libelle: Infrastructure (annuaire, PKI, approbations)
    niveau: N3
    traite: [replication, controleurs, approbations, pki, iis, incident_majeur]
  Reseau: { libelle: Équipe réseau, traite: [lan, wan, pare_feu, vlan, relais_dhcp] }
  Virtualisation: { libelle: Équipe virtualisation, traite: [hyperviseurs, vm] }
  Securite: { libelle: Centre opérationnel de sécurité, traite: [attaque, compromission, antivirus] }
  Poste-Travail: { libelle: Équipe poste de travail (socle et packaging), traite: [socle, packaging, deploiement] }
  Proximite-Lyon: { libelle: Technicien de proximité de Lyon, contact: kleroy }
  Orbis-IT: { libelle: Informatique d'Orbis (filiale), externe: true, traite: [orbis] }
  Editeur-Compteo: { libelle: Support de l'éditeur de Compteo, externe: true }

# --- Annuaire -----------------------------------------------------------------

