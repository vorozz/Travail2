# --- Documentation -----------------------------------------------------------

documents:
  KB-0101:
    titre: Compte verrouillé
    niveau: N1
    contenu: >
      Vérifier l'identité de l'appelant (rappel au numéro de l'annuaire ou
      matricule). Vérifier que le compte est bien verrouillé et non désactivé
      ou expiré. Déverrouiller. Si le compte se reverrouille dans la journée,
      ne pas déverrouiller une deuxième fois : transmettre au support systèmes
      (N2) pour recherche de la source dans les journaux des DC.
  KB-0102:
    titre: Règles de mot de passe
    niveau: N1
    contenu: >
      Stratégie du domaine : 12 caractères minimum, 3 catégories de
      caractères, 24 derniers mots de passe interdits, changement tous les
      90 jours. Certains comptes sont soumis à une stratégie renforcée (PSO) :
      vérifier la stratégie résultante du compte. Ne jamais cocher « Le mot de
      passe n'expire jamais » sur un compte nominatif. Un mot de passe
      provisoire se communique par SMS au numéro de l'annuaire, jamais par
      courriel, et impose un changement à la connexion.
  KB-0115:
    titre: Accès aux partages et lecteurs réseau
    niveau: N1
    contenu: >
      Les lecteurs réseau sont créés à l'ouverture de session par
      GPO_U_Lecteurs_Reseau, selon les groupes du compte. Tout ajout à un
      groupe d'accès doit être validé par le responsable de l'utilisateur
      (dans le ticket). Après l'ajout, l'utilisateur doit fermer puis rouvrir
      sa session : un gpupdate ne met pas à jour ses groupes. Ne jamais
      recopier les groupes d'un collègue.
  KB-0120:
    titre: Spouleur d'impression arrêté sur un poste
    niveau: N1
    contenu: >
      Si le spouleur s'arrête à nouveau juste après un redémarrage, un travail
      d'impression corrompu est probablement en cause : arrêter le service,
      supprimer le contenu de C:\Windows\System32\spool\PRINTERS (et
      seulement ce dossier), redémarrer le service. Ne pas toucher aux files
      d'attente du serveur d'impression, partagées par tout un étage.
  KB-0210:
    titre: Postes de travail - OU et groupes
    niveau: N2
    contenu: >
      Un poste réaffecté d'un site à l'autre doit être déplacé dans l'OU
      Postes du nouveau site (Standard ou Portables). Les postes de la
      comptabilité de Paris sont membres de GG_Postes_Compta, qui cible
      GPO_C_Compta_ModeIE. L'appartenance d'un ordinateur à un groupe n'est
      prise en compte qu'après un redémarrage.
  KB-0230:
    titre: Verrouillages répétés d'un compte
    niveau: N2
    contenu: >
      Lire l'événement 4740 sur l'émulateur PDC (DC-PAR-01) : le champ « Nom
      de l'ordinateur appelant » donne la machine d'origine. Les 4771 (code
      0x18) sur les autres DC donnent l'adresse IP du client. Causes
      fréquentes : session ouverte ailleurs, lecteur réseau avec identifiants
      enregistrés, tâche planifiée, téléphone. Traiter la source avant de
      déverrouiller.
  KB-0305:
    titre: Incident majeur
    niveau: N2
    contenu: >
      Plus de 10 utilisateurs ou un service entier touchés : déclarer un
      incident majeur, rattacher les tickets à un ticket parent, informer la
      population concernée (bandeau, message), prévenir le responsable
      d'astreinte. Aucune modification d'infrastructure sans diagnostic
      partagé.

