escalade:
  equipes: [N3-Infrastructure]
  delai_cible: 15m
  indices_attendus:
    N1: [lien_tickets, recreation_n1]
    N2: [lien_tickets, echec_8524, ev_2087, dns_client_dc, resolution_echoue, doublon_ychevalier, asymetrie]
  note:
    elements:
      perimetre:
        description: Site et tickets concernés.
        mots_cles: [Nantes, trois tickets, 3 tickets, INC0031901]
        points: 5
      symptomes:
        description: Ce qui n'arrive pas à Nantes (nouveau compte, groupe, GPO d'imprimante).
        mots_cles: [nouvel arrivant, groupe, 'K:', imprimante, GPO]
        points: 5
      replication:
        description: Réplication entrante de DC-NTE-01 en échec.
        mots_cles: [réplication, 8524, DC-NTE-01, depuis le 17]
        points: 8
      cause:
        description: DNS client du DC depuis la migration de VM.
        mots_cles: [DNS, 8.8.8.8, 10.30.1.1, carte réseau, CHG0004633]
        points: 6
      doublon:
        description: "Compte recréé à la main ce matin sur DC-NTE-01 : ne pas forcer la réplication avant de le traiter, réplication planifiée à 10:42."
        mots_cles: [doublon, recréé, lduval, ne pas forcer, 10:42, 10 h 42]
        points: 6

debrief:
  - Trois symptômes différents sur un même site avec un même âge (après le 17/11) désignent une divergence entre DC.
  - L'erreur 8524 est une erreur DNS du DC destination ; le DNS d'un DC pointe vers des DNS de l'annuaire, jamais vers un DNS public.
  - Une réplication à sens unique désigne la machine qui ne résout pas.
  - Pendant une divergence, des corrections locales (compte recréé) deviennent des bombes à retardement ; on les traite avant de rétablir la réplication.
  - Forcer une réplication, retirer un DC ou toucher à la cohérence stricte ne se fait qu'après un diagnostic complet.
  - Le texte d'un événement liste des actions possibles, pas l'action à faire.
