debrief:
  - Le code 1603 dit seulement « échec fatal » ; le journal MSI verbeux et les événements voisins (11904, SideBySide 33) donnent la cause.
  - Comparer les postes en échec et en réussite par population (socle, modèle, site) révèle la variable commune.
  - Deux codes d'erreur différents dans un même déploiement peuvent cacher une seule cause pour la même population.
  - Un prérequis se déclare en dépendance, ciblée ; il ne se pousse pas sur tout le parc.
  - Valider sur un poste pilote avant de relancer en masse.
  - Le socle appartient à son équipe : on lui transmet le besoin, on ne modifie pas le master.
