        mots_cles: [autre poste, PC de Nadia, compte fonctionne, PC-PAR-0151]
        points: 5

debrief:
  - gpresult distingue une GPO hors de portée (absente) d'une GPO filtrée (refusée, avec la raison).
  - Deux causes peuvent s'empiler ; corriger la première en fait apparaître une seconde.
  - Le filtrage de sécurité d'une GPO ordinateur porte sur le compte ordinateur, et son appartenance aux groupes date du dernier démarrage.
  - Parmi plusieurs GPO refusées, seule compte celle qui porte le paramètre attendu.
  - On ne modifie jamais la portée d'une GPO partagée pour un seul poste.
