escalade:
  equipes: [N2-Systemes]
  delai_cible: 10m
  indices_attendus:
    N1: [mauvaise_ou, pas_dans_groupe, compte_ok]
  note:
    elements:
      symptome:
        description: Symptômes (Compteo Web sans mode IE, copieurs de Lyon).
        mots_cles: [Compteo, mode IE, Internet Explorer, imprimantes de Lyon, copieurs de Lyon]
        points: 6
      poste:
        description: Poste concerné et son historique.
        mots_cles: [PC-PAR-0298, PC-LYO-0087]
        points: 6
