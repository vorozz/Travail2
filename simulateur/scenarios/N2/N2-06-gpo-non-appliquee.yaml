        mots_cles: [OU, Lyon, filtrage, GG_Postes_Compta]
        points: 5
      action:
        description: Actions (déplacement, ajout au groupe, redémarrage).
        mots_cles: [déplac, ajout, redémarr]
        points: 5
      prevention:
